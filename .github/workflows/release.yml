# On a version tag (v0.1.0): publish create-laddu (the laddu CLI) to npm and upload install.sh to S3.
# Needs secrets NPM_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and variables
# INSTALL_BUCKET (bucket name) and AWS_REGION.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        working-directory: apps/cli
      - name: Tag matches the CLI's version
        run: test "v$(jq -r .version apps/cli/package.json)" = "$GITHUB_REF_NAME"
      - run: bun run build
        working-directory: apps/cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish apps/cli/dist --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Upload install.sh
        run: >-
          aws s3 cp apps/cli/install.sh "s3://${{ vars.INSTALL_BUCKET }}/install.sh"
          --content-type text/x-shellscript --cache-control max-age=300
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
