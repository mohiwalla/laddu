# On a version tag (v0.1.0): publish create-laddu (the laddu CLI) to npm. Needs the secret
# NPM_TOKEN. install.sh needs no step: laddu.wtf serves it (apps/web/build.ts).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        working-directory: apps/cli
      - name: Tag matches the CLI's version
        run: test "v$(jq -r .version apps/cli/package.json)" = "$GITHUB_REF_NAME"
      - run: bun run build
        working-directory: apps/cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish apps/cli/dist --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
