settings:
  event_subscriptions:
    bot_events:
      # No agent_session_stopped subscription: show working status without a native Stop button.
      - app_home_opened
      - app_mention
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
      - member_joined_channel
      - member_left_channel
      - team_join
      - message.channels
      - message.groups
      - file_shared
      - channel_created
      - channel_rename
      - channel_archive
      - link_shared
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
